   <div class="container">
    <h1 class="text-center my-4">Contact Us</h1>
  
    <div class="row">
      <!-- Contact Form -->
      <div class="col-md-6">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              name="name"
              ngModel
              required
              placeholder="Enter your name"
            />
          </div>
  
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              name="email"
              ngModel
              required
              placeholder="Enter your email"
            />
          </div>
  
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input
              type="text"
              id="subject"
              class="form-control"
              name="subject"
              ngModel
              placeholder="Enter the subject"
            />
          </div>
  
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
              id="message"
              class="form-control"
              rows="4"
              name="message"
              ngModel
              required
              placeholder="Type your message here"
            ></textarea>
          </div>
  
          <button type="submit" class="btn btn-primary" [disabled]="!contactForm.valid">
            Submit
          </button>
        </form>
      </div>
  
      <!-- Contact Details -->
      <div class="col-md-6">
        <h5>Our Address</h5>
        <p>123 Rexine Street, Upholstery City, Country</p>
  
        <h5>Email</h5>
        <a href="mailto:info@rexineshop.com">info@rexineshop.com</a>
  
        <h5>Phone</h5>
        <a href="tel:+1234567890">+123 456 7890</a>
  
        <h5>Working Hours</h5>
        <p>Monday - Saturday: 9:00 AM - 6:00 PM</p>
  
        <!-- Embedded Google Map -->
        <div class="map-responsive mt-4">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345098046!2d144.95373521532136!3d-37.81627927975195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf57767818ff5f4fd!2sYour%20Shop!5e0!3m2!1sen!2sus!4v1615337811084!5m2!1sen!2sus"
            width="100%"
            height="200"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
  </div>

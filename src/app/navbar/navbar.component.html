  <header class="bg-white shadow-sm">
    <nav class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center">
          <h1 class="text-2xl font-bold text-blue-600">EasyShop</h1>
        </div>
        
        <!-- Desktop Navigation -->
        <div class="hidden md:flex space-x-8">
          <a class="text-gray-700 hover:text-blue-600" routerLink="/">Home</a>
          <a class="text-gray-700 hover:text-blue-600" routerLink="product">Products</a>
          <a class="text-gray-700 hover:text-blue-600" routerLink="about">About</a>
          <a class="text-gray-700 hover:text-blue-600" routerLink="testinomial">Testinomial</a>
          <a href="#" class="text-gray-700 hover:text-blue-600" routerLink="product-card">Product Card</a>
          <a href="#" class="text-gray-700 hover:text-blue-600" routerLink="contact">Contact</a>
        </div>

        <div class="flex items-center space-x-4">
          <!-- Shopping Cart -->
          <button class="text-gray-700 hover:text-blue-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
          </button>
          
          <!-- Mobile Menu Button -->
          <button (click)="toggleMobileMenu()" class="md:hidden text-gray-700 hover:text-blue-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </nav>
    
    <!-- Mobile Menu -->
    <!-- <app-mobile-menu [isOpen]="isMobileMenuOpen"></app-mobile-menu> -->
     <app-mob-nav [isOpen]="isMobileMenuOpen"></app-mob-nav>
  </header>
